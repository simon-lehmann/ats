# Copy to ats.toml and adjust. All keys optional — defaults shown.

[daemon]
workspaces_root = "~/ats/workspaces"
scrollback_lines = 10000
idle_threshold_secs = 8

[orchestrator]
model = "claude-haiku-4-5"    # used by the on-demand digest/ask helpers
auto_digest = false           # calm by default
# base_url = "https://api.anthropic.com"   # override for proxies/tests
# API key (digest/ask only) comes from $ANTHROPIC_API_KEY
mcp_enabled = true            # serve the ATS tools to Claude Code sessions
mcp_port = 8765               # loopback MCP endpoint: 127.0.0.1:<port>/mcp

[ui]
rail_width = 28
group_a_slots = 5
group_b_slots = 5

# calm per-template tab tinting (named colors or "#rrggbb")
# [ui.template_colors]
# demo-app = "cyan"
# web-app = "#87af87"

# [keys]
# spawn = "alt+s"
# review_queue = "alt+q"
